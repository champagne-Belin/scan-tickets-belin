<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b3a2f">
<link rel="manifest" href="manifest.json">
<title>Scan tickets</title>
<style>
  :root { --vert:#1b3a2f; --or:#c9a24a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,system-ui,sans-serif; background:#f4f1ea; color:#222; min-height:100vh; display:flex; flex-direction:column; }
  header { background:var(--vert); color:#fff; padding:16px; text-align:center; font-size:18px; letter-spacing:.5px; }
  main { flex:1; padding:16px; display:flex; flex-direction:column; gap:14px; max-width:560px; margin:0 auto; width:100%; }
  button, label.btn { display:block; width:100%; padding:18px; border:0; border-radius:14px; font-size:18px; font-weight:600; text-align:center; cursor:pointer; }
  .primary { background:var(--vert); color:#fff; }
  .send { background:var(--or); color:#1b1b1b; }
  .ghost { background:#e4dfd2; color:#333; }
  button:disabled { opacity:.45; }
  input[type=file] { display:none; }
  #preview { width:100%; max-height:46vh; object-fit:contain; border-radius:10px; background:#fff; box-shadow:0 1px 6px rgba(0,0,0,.15); display:none; }
  #status { text-align:center; min-height:24px; font-size:16px; }
  .ok { color:#1d7a3a; } .ko { color:#b3261e; }
  .row { display:flex; gap:10px; } .row > * { flex:1; }
  #cropbox { display:none; flex-direction:column; gap:10px; }
  #cropcv { width:100%; border-radius:10px; background:#222; touch-action:none; display:block; }
  #cropmsg { text-align:center; font-size:15px; color:#444; }
  #form { display:none; background:#fff; border-radius:12px; padding:14px; box-shadow:0 1px 6px rgba(0,0,0,.12); }
  #form label { display:block; font-size:13px; color:#666; margin:8px 0 3px; }
  #form input { width:100%; padding:12px; font-size:18px; border:1px solid #ccc; border-radius:8px; }
  #nom { margin-top:10px; font-size:13px; color:#555; word-break:break-all; }
</style>
</head>
<body>
<header>🍾 Scan tickets — Passerelle <small style="opacity:.6">v5</small></header>
<main>
  <label class="btn primary" for="cam">📷 Photographier un ticket</label>
  <input id="cam" type="file" accept="image/*" capture="environment">

  <!-- Étape 1 : cadrage -->
  <div id="cropbox">
    <div id="cropmsg">Glisse les 4 points sur les coins du ticket</div>
    <canvas id="cropcv"></canvas>
    <div class="row">
      <button class="ghost" id="rot">↻ Pivoter</button>
      <button class="primary" id="valider">Valider le cadrage</button>
    </div>
  </div>

  <!-- Étape 2 : résultat + nom -->
  <img id="preview" alt="Aperçu du document">
  <div class="row" id="actions" style="display:none">
    <button class="ghost" id="mode">Noir et blanc</button>
    <button class="ghost" id="recadrer">Recadrer</button>
  </div>

  <div id="form">
    <label for="f-date">Date d'achat</label>
    <input id="f-date" type="date">
    <label for="f-ens">Enseigne</label>
    <input id="f-ens" type="text" autocapitalize="words" placeholder="Nom du commerce">
    <label for="f-mnt">Montant TTC (€)</label>
    <input id="f-mnt" type="text" inputmode="decimal" placeholder="23,45">
    <div id="nom"></div>
  </div>

  <button class="send" id="send" disabled>Envoyer vers SharePoint</button>
  <div id="status"></div>
  <button class="ghost" id="maj" style="font-size:15px;padding:12px">🔄 Mettre à jour l'appli</button>
</main>

<script>
// ====== RÉGLAGES ======
const WEBHOOK_URL = "https://hook.eu1.make.com/8yke59bsuvqm1yocsky8wpuxh6lzan6x";
// La clé secrète n'est pas dans le code : elle est saisie une fois sur le téléphone
let CLE = localStorage.getItem('cle') || '';
function assureCle() {
  if (!CLE) {
    CLE = (prompt("Code secret de l'appli (à saisir une seule fois) :") || '').trim();
    if (CLE) localStorage.setItem('cle', CLE);
  }
}
let QUI = localStorage.getItem('qui') || '';
function assureQui() {
  if (!QUI) {
    QUI = (prompt("Ton prénom (à saisir une seule fois) :") || '').trim();
    if (QUI) localStorage.setItem('qui', QUI);
  }
}
// ======================

const $ = id => document.getElementById(id);
let srcCanvas = null, outCanvas = null, corners = null, bw = true, pdfB64 = null, cvReady = false;

function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
const libs = (async () => {
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  await loadScript('https://docs.opencv.org/4.9.0/opencv.js');
  await new Promise(r => { if (cv.Mat) r(); else cv['onRuntimeInitialized'] = r; });
  cvReady = true;
})().catch(() => { cvReady = false; });

function setStatus(msg, cls) { $('status').textContent = msg; $('status').className = cls || ''; }

// ---------- Nom du fichier ----------
const clean = s => (s || '').replace(/[\\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim();
function nomFichier() {
  const d = $('f-date').value || 'DATE';
  const e = clean($('f-ens').value).replace(/ /g, '-') || 'ENSEIGNE';
  const m = clean($('f-mnt').value).replace('.', ',').replace(/€|\s/g, '') || 'MONTANT';
  return `${d}_${e}_${m}_TTC.pdf`;
}
function majNom() { $('nom').textContent = '📄 ' + nomFichier(); }
['f-date', 'f-ens', 'f-mnt'].forEach(id => $(id).addEventListener('input', majNom));

// ---------- PDF ----------
async function buildPdf() {
  if (pdfB64) return pdfB64;
  await libs;
  const { jsPDF } = window.jspdf;
  const w = outCanvas.width, h = outCanvas.height;
  const pdf = new jsPDF({ orientation: w > h ? 'l' : 'p', unit: 'px', format: [w, h], compress: true });
  pdf.addImage(outCanvas.toDataURL('image/jpeg', 0.85), 'JPEG', 0, 0, w, h);
  pdfB64 = pdf.output('datauristring').split(',')[1];
  return pdfB64;
}

async function appel(payload) {
  assureCle(); assureQui();
  const r = await fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cle: CLE, qui: QUI, ...payload }) });
  if (!r.ok) throw new Error(r.status);
  return r.text();
}

// ---------- Lecture du ticket (Claude via Make) ----------
async function lireTicket() {
  $('form').style.display = 'block';
  $('f-date').value = ''; $('f-ens').value = ''; $('f-mnt').value = ''; majNom();
  setStatus('Lecture du ticket…');
  try {
    const rep = await appel({ action: 'lire', data: await buildPdf() });
    const [date, ens, mnt] = rep.trim().split('|').map(s => (s || '').trim());
    if (/^\d{4}-\d{2}-\d{2}$/.test(date)) $('f-date').value = date;
    $('f-ens').value = ens || ''; $('f-mnt').value = mnt || '';
    majNom();
    setStatus(date && ens && mnt ? 'Vérifie le nom, puis envoie.' : 'Complète les champs vides, puis envoie.');
  } catch (e) {
    setStatus('Lecture automatique impossible : complète les champs.', 'ko');
  }
}

// ---------- Détection automatique des coins (point de départ) ----------
function orderPoints(p) {
  const s = p.map(q => q.x + q.y), d = p.map(q => q.x - q.y);
  return [p[s.indexOf(Math.min(...s))], p[d.indexOf(Math.max(...d))], p[s.indexOf(Math.max(...s))], p[d.indexOf(Math.min(...d))]];
}
function defaultCorners() {
  const w = srcCanvas.width, h = srcCanvas.height, mx = w * 0.08, my = h * 0.08;
  return [{ x: mx, y: my }, { x: w - mx, y: my }, { x: w - mx, y: h - my }, { x: mx, y: h - my }];
}
// Méthode 1 : le papier est la grande zone claire de la photo
function detectPaper() {
  if (!cvReady) return null;
  let src = cv.imread(srcCanvas), gray = new cv.Mat(), bin = new cv.Mat(), contours = new cv.MatVector(), hier = new cv.Mat(), res = null;
  try {
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray, gray, new cv.Size(9, 9), 0);
    cv.threshold(gray, bin, 0, 255, cv.THRESH_BINARY + cv.THRESH_OTSU);
    cv.morphologyEx(bin, bin, cv.MORPH_CLOSE, cv.Mat.ones(25, 25, cv.CV_8U));
    cv.findContours(bin, contours, hier, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
    const total = src.rows * src.cols; let bestArea = total * 0.06, best = null;
    for (let i = 0; i < contours.size(); i++) {
      const c = contours.get(i), a = cv.contourArea(c);
      if (a > bestArea && a < total * 0.92) { bestArea = a; best = c; }
    }
    if (best) {
      const ap = new cv.Mat(); cv.approxPolyDP(best, ap, 0.03 * cv.arcLength(best, true), true);
      let pts = [];
      if (ap.rows === 4 && cv.isContourConvex(ap)) { for (let j = 0; j < 4; j++) pts.push({ x: ap.intAt(j, 0), y: ap.intAt(j, 1) }); }
      else { pts = cv.RotatedRect.points(cv.minAreaRect(best)).map(p => ({ x: p.x, y: p.y })); }
      ap.delete(); res = orderPoints(pts);
    }
  } catch (e) { res = null; }
  [src, gray, bin, contours, hier].forEach(m => { try { m.delete(); } catch (_) {} });
  return res;
}
function detectCorners() {
  return detectPaper() || detectEdges() || defaultCorners();
}
// Méthode 2 : contours (repli)
function detectEdges() {
  if (!cvReady) return null;
  let src = cv.imread(srcCanvas), gray = new cv.Mat(), blur = new cv.Mat(), edges = new cv.Mat();
  let contours = new cv.MatVector(), hier = new cv.Mat(), res = null;
  try {
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0);
    cv.Canny(blur, edges, 50, 150);
    cv.dilate(edges, edges, cv.Mat.ones(3, 3, cv.CV_8U));
    cv.findContours(edges, contours, hier, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);
    const total = src.rows * src.cols;
    let bestArea = total * 0.08;
    for (let i = 0; i < contours.size(); i++) {
      const c = contours.get(i), peri = cv.arcLength(c, true), ap = new cv.Mat();
      cv.approxPolyDP(c, ap, 0.02 * peri, true);
      const area = cv.contourArea(ap);
      // on évite le cadre qui occupe quasiment toute la photo
      if (ap.rows === 4 && area > bestArea && area < total * 0.9 && cv.isContourConvex(ap)) {
        bestArea = area; const pts = []; for (let j = 0; j < 4; j++) pts.push({ x: ap.intAt(j, 0), y: ap.intAt(j, 1) });
        res = orderPoints(pts);
      }
      ap.delete();
    }
  } catch (e) { res = null; }
  [src, gray, blur, edges, contours, hier].forEach(m => { try { m.delete(); } catch (_) {} });
  return res;
}

// ---------- Étape 1 : cadrage manuel ----------
const cc = $('cropcv'); let drag = -1;
function showCrop() {
  ['preview', 'actions', 'form'].forEach(id => $(id).style.display = 'none');
  $('send').disabled = true;
  $('cropbox').style.display = 'flex';
  cc.width = srcCanvas.width; cc.height = srcCanvas.height;
  drawCrop(); setStatus('');
}
function drawCrop() {
  const x = cc.getContext('2d'), k = cc.width / cc.clientWidth || 1;
  x.clearRect(0, 0, cc.width, cc.height); x.drawImage(srcCanvas, 0, 0);
  x.lineWidth = 3 * k; x.strokeStyle = '#c9a24a'; x.fillStyle = 'rgba(201,162,74,.18)';
  x.beginPath(); corners.forEach((p, i) => i ? x.lineTo(p.x, p.y) : x.moveTo(p.x, p.y)); x.closePath(); x.fill(); x.stroke();
  corners.forEach(p => { x.beginPath(); x.arc(p.x, p.y, 16 * k, 0, 7); x.fillStyle = '#1b3a2f'; x.fill(); x.lineWidth = 3 * k; x.strokeStyle = '#fff'; x.stroke(); });
}
function ptr(e) { const r = cc.getBoundingClientRect(), k = cc.width / r.width; return { x: (e.clientX - r.left) * k, y: (e.clientY - r.top) * k }; }
cc.addEventListener('pointerdown', e => {
  const p = ptr(e), k = cc.width / cc.clientWidth; let best = 70 * k;
  drag = -1; corners.forEach((c, i) => { const d = Math.hypot(c.x - p.x, c.y - p.y); if (d < best) { best = d; drag = i; } });
  if (drag >= 0) cc.setPointerCapture(e.pointerId);
});
cc.addEventListener('pointermove', e => {
  if (drag < 0) return; const p = ptr(e);
  corners[drag] = { x: Math.max(0, Math.min(cc.width, p.x)), y: Math.max(0, Math.min(cc.height, p.y)) }; drawCrop();
});
['pointerup', 'pointercancel'].forEach(ev => cc.addEventListener(ev, () => drag = -1));

$('rot').onclick = () => {
  const c = document.createElement('canvas'); c.width = srcCanvas.height; c.height = srcCanvas.width;
  const x = c.getContext('2d'); x.translate(c.width, 0); x.rotate(Math.PI / 2); x.drawImage(srcCanvas, 0, 0);
  srcCanvas = c; corners = detectCorners(); showCrop();
};

// ---------- Étape 2 : redressement + noir et blanc ----------
function traiter() {
  pdfB64 = null;
  const [tl, tr, br, bl] = corners;
  const w = Math.round(Math.max(Math.hypot(tr.x - tl.x, tr.y - tl.y), Math.hypot(br.x - bl.x, br.y - bl.y)));
  const h = Math.round(Math.max(Math.hypot(bl.x - tl.x, bl.y - tl.y), Math.hypot(br.x - tr.x, br.y - tr.y)));
  if (!cvReady || w < 20 || h < 20) {
    const xs = corners.map(p => p.x), ys = corners.map(p => p.y);
    const x0 = Math.min(...xs), y0 = Math.min(...ys), cw = Math.max(...xs) - x0, ch = Math.max(...ys) - y0;
    outCanvas = document.createElement('canvas'); outCanvas.width = cw; outCanvas.height = ch;
    outCanvas.getContext('2d').drawImage(srcCanvas, x0, y0, cw, ch, 0, 0, cw, ch);
    return;
  }
  let src = cv.imread(srcCanvas), warped = new cv.Mat(), out = new cv.Mat();
  const M = cv.getPerspectiveTransform(cv.matFromArray(4, 1, cv.CV_32FC2, [tl.x, tl.y, tr.x, tr.y, br.x, br.y, bl.x, bl.y]),
                                       cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, w, 0, w, h, 0, h]));
  cv.warpPerspective(src, warped, M, new cv.Size(w, h)); M.delete();
  if (bw) {
    cv.cvtColor(warped, out, cv.COLOR_RGBA2GRAY);
    cv.adaptiveThreshold(out, out, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 31, 15);
  } else { warped.copyTo(out); }
  outCanvas = document.createElement('canvas'); cv.imshow(outCanvas, out);
  [src, warped, out].forEach(m => m.delete());
}
function montrer() {
  const p = $('preview'); p.src = outCanvas.toDataURL('image/jpeg', 0.9); p.style.display = 'block';
  $('actions').style.display = 'flex';
}

async function valider() {
  await libs; traiter(); $('cropbox').style.display = 'none'; montrer();
  $('send').disabled = false; lireTicket();
}
$('valider').onclick = valider;
$('mode').onclick = () => { bw = !bw; $('mode').textContent = bw ? 'Noir et blanc' : 'Couleur'; traiter(); montrer(); };
$('recadrer').onclick = showCrop;

// ---------- Photo ----------
$('cam').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  setStatus('Chargement de la photo…');
  const img = await createImageBitmap(f, { imageOrientation: 'from-image' });
  const maxSide = 1800, k = Math.min(1, maxSide / Math.max(img.width, img.height));
  srcCanvas = document.createElement('canvas');
  srcCanvas.width = Math.round(img.width * k); srcCanvas.height = Math.round(img.height * k);
  srcCanvas.getContext('2d').drawImage(img, 0, 0, srcCanvas.width, srcCanvas.height);
  e.target.value = '';
  await libs;
  corners = detectCorners();
  setStatus('Cadrage automatique…');
  valider();   // tout est automatique ; « Recadrer » permet de corriger à la main
});

// ---------- Envoi ----------
$('send').onclick = async () => {
  const nom = nomFichier();
  if (/DATE|ENSEIGNE|MONTANT/.test(nom) && !confirm('Des champs sont vides. Envoyer quand même ?\n' + nom)) return;
  $('send').disabled = true; setStatus('Envoi en cours…');
  try {
    const rep = await appel({ action: 'envoyer', filename: nom, data: await buildPdf() });
    if (rep.trim() !== 'OK') { localStorage.removeItem('cle'); CLE = ''; throw new Error('code secret refusé'); }
    setStatus('✅ Envoyé : ' + nom, 'ok');
    ['preview', 'actions', 'form'].forEach(id => $(id).style.display = 'none');
  } catch (err) {
    setStatus('Envoi non abouti, réessaie (' + err.message + ')', 'ko'); $('send').disabled = false;
  }
};

// ---------- Mise à jour de l'appli (le code secret est conservé) ----------
$('maj').onclick = async () => {
  setStatus('Mise à jour…');
  try { for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); } catch (_) {}
  try { for (const k of await caches.keys()) await caches.delete(k); } catch (_) {}
  try { await Promise.all([location.pathname, 'index.html', 'manifest.json', 'sw.js'].map(u => fetch(u, { cache: 'reload' }))); } catch (_) {}
  location.reload();
};

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
